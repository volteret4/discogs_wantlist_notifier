# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  discogs-wantlist-notifier:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - .:/app
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "discogs_wantlist_notifier"
      ofelia.job-exec.discogs-wantlist-scan.schedule: "0 0 */4 * * *"
      ofelia.job-exec.discogs-wantlist-scan.command: "nice -n 19 ionice -c 3 python3 discogs_wantlist_notifier.py"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=discogs_wantlist_notifier
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - discogs-wantlist-notifier
